{{- range .Values.consumers }}
{{- $consumer := . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name }}-writer
  namespace: {{ .namespace }}
rules:
  {{- range .rules }}
  - apiGroups: {{ .apiGroups | toYaml | nindent 6 }}
    resources: {{ .resources | toYaml | nindent 6 }}
    verbs: ["get", "list", "create", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}-writer
  namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .name }}
    namespace: {{ .namespace }}
roleRef:
  kind: Role
  name: {{ .name }}-writer
  apiGroup: rbac.authorization.k8s.io
{{- if .clusterRules }}
---
# Cluster-scoped resources (CustomResourceDefinition, ClusterIssuer,
# ClusterRole, etc.) can never be granted by a namespaced Role/RoleBinding
# no matter what's listed in its rules -- confirmed directly against a
# real dry-run ("... is forbidden ... at the cluster scope" even though
# the resource was already listed in the namespaced Role above). Only
# set clusterRules for the specific cluster-scoped kinds a consumer's
# chart actually renders, scoped with resourceNames wherever the kind
# supports it so one consumer's CI can never touch another's.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .name }}-writer-cluster
rules:
  {{- range .clusterRules }}
  - apiGroups: {{ .apiGroups | toYaml | nindent 6 }}
    resources: {{ .resources | toYaml | nindent 6 }}
    {{- if .resourceNames }}
    resourceNames: {{ .resourceNames | toYaml | nindent 6 }}
    {{- end }}
    verbs: ["get", "list", "create", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .name }}-writer-cluster
subjects:
  - kind: ServiceAccount
    name: {{ .name }}
    namespace: {{ .namespace }}
roleRef:
  kind: ClusterRole
  name: {{ .name }}-writer-cluster
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- range .extraNamespaceRules }}
---
# Some consumers' charts render resources into a namespace other than
# their own (e.g. a wildcard cert-manager Certificate/traefik TLSStore
# living in kube-system, not cert-manager) -- a Role bound in the
# consumer's own namespace can't reach those, RoleBindings just need a
# Role that actually exists *in* the target namespace. The RoleBinding's
# subject still points back at the consumer's own ServiceAccount
# (cross-namespace subject references are valid Kubernetes RBAC).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $consumer.name }}-writer-{{ .namespace }}
  namespace: {{ .namespace }}
rules:
  {{- range .rules }}
  - apiGroups: {{ .apiGroups | toYaml | nindent 6 }}
    resources: {{ .resources | toYaml | nindent 6 }}
    {{- if .resourceNames }}
    resourceNames: {{ .resourceNames | toYaml | nindent 6 }}
    {{- end }}
    verbs: ["get", "list", "create", "patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $consumer.name }}-writer-{{ .namespace }}
  namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $consumer.name }}
    namespace: {{ $consumer.namespace }}
roleRef:
  kind: Role
  name: {{ $consumer.name }}-writer-{{ .namespace }}
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# Narrow, separate from the writer Role above: only lets the *shared*
# runner identity (github-runner-workload, used by every repo's CI) mint
# a short-lived token for this one consumer's CI ServiceAccount --
# nothing else. The runner identity itself never gains direct write
# access; only {{ .name }} does, and only for as long as a freshly
# minted token (10 minutes) lasts.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name }}-token-issuer
  namespace: {{ .namespace }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["{{ .name }}"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}-token-issuer
  namespace: {{ .namespace }}
  labels:
    ci-namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: github-runner-workload
    namespace: github-runner
roleRef:
  kind: Role
  name: {{ .name }}-token-issuer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
