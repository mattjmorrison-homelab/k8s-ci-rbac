{{- range .Values.jobServiceAccounts }}
{{- $repo := trimSuffix "-job" .name }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
  # The Job's own pod runs as this same ServiceAccount, purely for
  # imagePullSecrets lookup -- kaniko/pytest/npm never call the k8s API, so
  # no RBAC risk from reuse. This same ServiceAccount also authenticates
  # the per-repo zot-pull-secret's SecretStore below (job-zot-pull-secret.yaml)
  # -- one dedicated Zot credential per repo, not the old shared ci user.
imagePullSecrets:
  - name: {{ $repo }}-zot-pull-secret
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name }}-writer
  namespace: {{ .namespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}-writer
  namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .name }}
    namespace: {{ .namespace }}
roleRef:
  kind: Role
  name: {{ .name }}-writer
  apiGroup: rbac.authorization.k8s.io
---
# NOTE: unlike every other RBAC this repo grants, this is REAL create/delete
# of live Jobs, not a --dry-run=server wrapper. Scoped tightly via
# resourceNames below, but a real elevated grant -- treat changes here with
# more care than the dry-run consumers above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .name }}-token-issuer
  namespace: {{ .namespace }}
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    verbs: ["create"]
    resourceNames: ["{{ .name }}"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .name }}-token-issuer
  namespace: {{ .namespace }}
  labels:
    ci-namespace: {{ .namespace }}
subjects:
  - kind: ServiceAccount
    name: github-runner-workload
    namespace: github-runner
roleRef:
  kind: Role
  name: {{ .name }}-token-issuer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
