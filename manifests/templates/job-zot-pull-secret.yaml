{{- range .Values.jobServiceAccounts }}
{{- $repo := trimSuffix "-job" .name }}
---
# One dedicated Zot credential per Kaniko job repo, read via this same
# job's own ServiceAccount (see job-service-account-rbac.yaml) -- no
# cross-repo sharing, unlike the old single zot-pull-secret this replaces.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ $repo }}-zot-openbao
  namespace: {{ .namespace }}
spec:
  provider:
    vault:
      server: http://k8s-openbao.openbao.svc:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $repo }}
          serviceAccountRef:
            name: {{ .name }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $repo }}-zot-pull-secret
  namespace: {{ .namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ $repo }}-zot-openbao
    kind: SecretStore
  target:
    name: {{ $repo }}-zot-pull-secret
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"registry.morrisons.site":{"username":"{{ $repo }}","password":"{{ "{{" }} .password {{ "}}" }}","auth":"{{ "{{" }} printf "{{ $repo }}:%s" .password | b64enc {{ "}}" }}"}}}
  data:
    - secretKey: password
      remoteRef:
        key: homelab/service/k8s-zot/{{ $repo }}/zot-publish
        property: value
{{- end }}
